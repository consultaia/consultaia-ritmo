<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Ritmo — rotina inteligente em volta da sua escala</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1f2340;--mut:#6b7090;--line:#e7e6f2;--pri:#4f46e5;--pri2:#eef0ff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--pri)}
header select{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;max-width:150px}
h2{font-size:18px;margin:14px 0 8px}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(30,30,80,.05),0 4px 14px rgba(30,30,80,.04)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mut{color:var(--mut);font-size:13px}.wrap{flex-wrap:wrap}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:transparent;color:var(--mut);padding:8px}.btn.danger{background:#fee2e2;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.chip.off{background:#d1fae5;color:#047857}.chip.pn{background:#e0e7ff;color:#3730a3}.chip.wk{background:#e2e8f0;color:#334155}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;max-width:760px;width:100%}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--pri);font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}.item .tm{width:46px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
.item .bar{width:4px;align-self:stretch;border-radius:4px}.item .tt{flex:1;min-width:0}.item .tt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.done .tt div:first-child{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;font-size:14px;color:#fff}
.ck.on{background:var(--ok);border-color:var(--ok)}
.shiftrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin:4px 0;font-size:13px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{background:#fff;border-radius:10px;min-height:62px;padding:4px;font-size:12px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:2px}
.cal .d.x{opacity:.35}.cal .d.today{border-color:var(--pri)}.cal .d .n{font-weight:700}
.cal .d .chip{font-size:10px;padding:1px 5px;align-self:flex-start}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}.dots i{width:6px;height:6px;border-radius:50%}
.paint{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.paint button{border:2px solid transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap}
.paint button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:14px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mut)}
.hb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.field{display:block;margin:10px 0}.field>span{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}.toggle input{width:20px;height:20px}
.wd{display:flex;gap:4px;flex-wrap:wrap}.wd label{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;display:flex;gap:4px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(20,20,50,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:600px){.mask{align-items:center}.sheet{border-radius:20px}}
.alert{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.okmsg{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.steps{margin:0;padding-left:18px;font-size:14px}.steps li{margin:4px 0}
.empty{text-align:center;color:var(--mut);padding:14px 0;font-size:14px}
.segm{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;margin:8px 0}
.segm button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;font-size:13px}
.segm button.on{background:var(--pri2);color:var(--pri)}
.inl{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%;min-width:0;font:inherit;resize:vertical}
.inl.strike{text-decoration:line-through;color:var(--mut)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.hab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.hab span{font-size:22px}.hab b{font-size:13px}.hab small{color:var(--mut);font-size:11px}
.hab.on{border-color:var(--ok);background:#ecfdf5}
.moods{display:flex;justify-content:space-between;margin:4px 0 10px}
.moods button{font-size:28px;border:2px solid transparent;background:none;border-radius:50%;width:50px;height:50px;cursor:pointer;filter:grayscale(.7);opacity:.6}
.moods button.on{filter:none;opacity:1;border-color:var(--pri);background:var(--pri2)}
.modeopt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.modeopt small{display:block;color:var(--mut);margin-top:2px}.modeopt.on{border-color:var(--pri);background:var(--pri2)}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(79,70,229,.45);cursor:pointer;z-index:11}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(150px + env(safe-area-inset-bottom));background:#1f2340;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;max-width:90vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.brief pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:10px 0;background:var(--pri2);border-radius:12px;padding:10px 12px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.kinds button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.kinds button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri2);font-size:22px;cursor:pointer;flex:none}.mic.rec{background:#fee2e2;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,68,68,.15)}}
.segm{overflow-x:auto}.segm button{white-space:nowrap;min-width:max-content;padding:8px 10px}
.gridwrap{overflow-x:auto;margin:8px -14px;padding:0 14px}
.wgrid{display:grid;min-width:560px;background:#fff;border-radius:14px;padding:6px 6px 8px 0}
.gh{text-align:center;font-size:11px;color:var(--mut);padding:4px 0 6px}.gh b{display:block;font-size:16px;color:var(--ink)}.gh.on b{color:#fff;background:var(--pri);border-radius:50%;width:28px;height:28px;line-height:28px;margin:0 auto}
.gcol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.gcol.hours{border:0;background:none}.gcol.hours span{position:absolute;right:4px;font-size:10px;color:var(--mut);transform:translateY(-6px)}
.gb{position:absolute;left:2px;right:2px;border-radius:6px;font-size:10px;line-height:1.2;padding:2px 4px;overflow:hidden;color:#fff;cursor:pointer}
.gb.shift{opacity:.9}.gb.rest{background:repeating-linear-gradient(45deg,#e0e7ff,#e0e7ff 4px,#eef2ff 4px,#eef2ff 8px);color:#3730a3}
.gb.dn{opacity:.45;text-decoration:line-through}
.gr{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);font-size:9px;color:#9a3412;padding-left:2px;white-space:nowrap;overflow:hidden;pointer-events:none}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== Constantes ===================== */
const CATS={
  casa:{n:'Casa',c:'#f59e0b',i:'🏠'}, treino:{n:'Treino',c:'#ef4444',i:'🏋️'},
  lazer:{n:'Lazer',c:'#10b981',i:'🎉'}, saude:{n:'Saúde',c:'#3b82f6',i:'🩺'},
  estudo:{n:'Estudo',c:'#8b5cf6',i:'📚'}, pessoal:{n:'Pessoal',c:'#ec4899',i:'✨'},
  trabalho:{n:'Trabalho',c:'#64748b',i:'💼'}
};
const PERIODS={any:[0,1440,'Qualquer horário'],manha:[300,720,'Manhã'],tarde:[720,1080,'Tarde'],noite:[1080,1440,'Noite']};
const DEFAULT_SHIFTS={
  SD:{n:'Diurno 12h',s:420,e:1140,c:'#0ea5e9'},
  SN:{n:'Noturno 12h',s:1140,e:1860,c:'#1e293b'},
  M:{n:'Manhã 6h',s:420,e:780,c:'#22c55e'},
  T:{n:'Tarde 6h',s:780,e:1140,c:'#f97316'},
  P24:{n:'Plantão 24h',s:420,e:1860,c:'#7c3aed'}
};
const PATTERNS={
  '12x36d':{n:'12x36 diurno (SD, folga)',seq:['SD','-']},
  '12x36n':{n:'12x36 noturno (SN, folga)',seq:['SN','-']},
  'sdsn':{n:'SD, SN, folga, folga',seq:['SD','SN','-','-']},
  '12x60':{n:'12x60 (SD, folga, folga)',seq:['SD','-','-']},
  '24x72':{n:'24x72 (24h, 3 folgas)',seq:['P24','-','-','-']},
  'custom':{n:'Personalizado…',seq:[]}
};
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const KEY='ritmo.v1';

/* ===================== Utilidades ===================== */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const toMin=v=>{const[a,b]=String(v||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const fdur=m=>{m=Math.round(m);if(m<60)return m+'min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?pad(r):'')};
const todayS=()=>ds(new Date());
const clone=o=>JSON.parse(JSON.stringify(o));

/* ===================== Dados ===================== */
function defaultActs(){return[
  {id:uid(),name:'Academia',cat:'treino',per:3,dur:60,period:'manha',onlyOff:false,on:true},
  {id:uid(),name:'Faxina pesada',cat:'casa',per:1,dur:120,period:'manha',onlyOff:true,on:true},
  {id:uid(),name:'Lavar e passar roupa',cat:'casa',per:2,dur:60,period:'any',onlyOff:false,on:true},
  {id:uid(),name:'Mercado / feira',cat:'casa',per:1,dur:90,period:'tarde',onlyOff:false,on:true},
  {id:uid(),name:'Lazer em família',cat:'lazer',per:1,dur:180,period:'tarde',onlyOff:true,on:true},
  {id:uid(),name:'Leitura',cat:'pessoal',per:3,dur:30,period:'noite',onlyOff:false,on:true}
]}
function defaultHabits(){return[
  {id:uid(),name:'Beber 2 L de água',icon:'💧',days:[0,1,2,3,4,5,6]},
  {id:uid(),name:'Movimentar o corpo',icon:'🚶',days:[1,2,3,4,5]},
  {id:uid(),name:'Ler 10 páginas',icon:'📖',days:[0,1,2,3,4,5,6]}
]}
const MODES={
  escala:{n:'Escala / plantão',i:'🏥',d:'Plantões SD, SN, 24h, 12x36… O app protege descanso e pós-noturno.'},
  fixo:{n:'Horário fixo',i:'💼',d:'Trabalho ou aula em dias e horários definidos.'},
  livre:{n:'Rotina flexível',i:'🌿',d:'Casa, autônoma, estudante, maternidade: sem expediente fixo.'}
};
function newProfile(name,mode){mode=MODES[mode]?mode:'escala';return fixProfile({
  id:uid(),name,mode,
  settings:{wake:360,sleep:1380,rest:360,gap:15,buffer:mode==='escala'?45:mode==='fixo'?30:0,work:{on:mode==='fixo',days:[1,2,3,4,5],s:480,e:1080}},
  shiftTypes:clone(DEFAULT_SHIFTS),shifts:{},acts:defaultActs(),plan:{},habits:defaultHabits()
})}
/* Garante todos os campos (migra backups da versão anterior) */
function fixProfile(p){
  p.mode=MODES[p.mode]?p.mode:'escala';p.tasks=p.tasks||[];p.habits=p.habits||[];p.hlog=p.hlog||{};
  p.top=p.top||{};p.notes=p.notes||{};p.goals=p.goals||{};p.plan=p.plan||{};p.shifts=p.shifts||{};
  p.shiftTypes=p.shiftTypes||clone(DEFAULT_SHIFTS);p.acts=p.acts||[];p.reminders=p.reminders||[];p.expenses=p.expenses||[];return p;
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.profiles&&d.profiles.length){d.profiles.forEach(fixProfile);return d}}catch(e){}
  return{profiles:[newProfile('Eu','escala')],cur:0,seen:false};
}
let DB=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('Não foi possível salvar no aparelho.')}}
function save(){DB.meta=DB.meta||{};DB.meta.updatedAt=new Date().toISOString();persist();if(typeof cloudPush==='function')cloudPush()}
const P=()=>DB.profiles[DB.cur]||DB.profiles[0];

/* ===================== Nuvem (Supabase dri-imoveis · schema ritmo) ===================== */
const SUPABASE_URL='https://xmqmnmyejkfpmniljkbt.supabase.co';
const SUPABASE_KEY='COLE_AQUI_A_PUBLISHABLE_KEY'; /* Supabase > dri-imoveis > Project Settings > API Keys > publishable (ou anon) */
const CLOUD_ON=!!SUPABASE_KEY&&!SUPABASE_KEY.startsWith('COLE_');
const AKEY='ritmo.auth';
const CLOUD={session:null,status:'off',last:null,timer:null,busy:false};
try{CLOUD.session=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
function setSession(s){CLOUD.session=s;try{s?localStorage.setItem(AKEY,JSON.stringify(s)):localStorage.removeItem(AKEY)}catch(e){}}
async function authCall(path,body){
  const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(authMsg(j));
  return j;
}
function authMsg(j){const m=(j.error_description||j.msg||j.message||j.error||'').toLowerCase();
  if(m.includes('invalid login'))return'E-mail ou senha incorretos.';
  if(m.includes('not confirmed'))return'Confirme seu e-mail (veja a caixa de entrada) e tente de novo.';
  if(m.includes('already registered')||m.includes('already been registered'))return'Este e-mail já tem conta. Use Entrar.';
  if(m.includes('password'))return'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('rate'))return'Muitas tentativas. Aguarde um minuto.';
  return j.error_description||j.msg||j.message||'Falha na conexão.'}
const keepSession=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(CLOUD.session&&CLOUD.session.email),uid:j.user&&j.user.id||(CLOUD.session&&CLOUD.session.uid)});
async function token(){
  const s=CLOUD.session;if(!s)return null;
  if(s.expires_at-60>Date.now()/1000)return s.access_token;
  try{setSession(keepSession(await authCall('token?grant_type=refresh_token',{refresh_token:s.refresh_token})));return CLOUD.session.access_token}
  catch(e){setSession(null);CLOUD.status='off';render();return null}
}
async function rest(method,query,body){
  const t=await token();if(!t)throw new Error('sem sessão');
  const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json','Accept-Profile':'ritmo','Content-Profile':'ritmo'};
  if(method==='POST')h.Prefer='resolution=merge-duplicates,return=representation';
  const r=await fetch(SUPABASE_URL+'/rest/v1/estado'+query,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));
  return j;
}
function localStamp(){return(DB.meta&&DB.meta.updatedAt)||null}
/* Puxa da nuvem; fica com a versão mais recente entre aparelho e nuvem */
async function cloudPull(){
  if(!CLOUD_ON||!CLOUD.session)return;
  CLOUD.status='sync';
  try{
    const rows=await rest('GET','?select=dados,atualizado_em&user_id=eq.'+CLOUD.session.uid);
    const remote=rows&&rows[0];
    const synced=DB.meta&&DB.meta.syncedAt,changedLocal=localStamp()&&(!synced||localStamp()>synced);
    if(remote&&remote.dados&&remote.dados.profiles&&(!changedLocal||remote.atualizado_em>localStamp())){
      const d=remote.dados;d.profiles.forEach(fixProfile);d.meta=Object.assign({},d.meta,{syncedAt:remote.atualizado_em,updatedAt:remote.atualizado_em});
      DB=d;if(DB.cur>=DB.profiles.length)DB.cur=0;persist();CLOUD.status='ok';CLOUD.last=new Date();if(!UI.modal)render();
    }else await cloudPush(true);
  }catch(e){CLOUD.status='erro';CLOUD.err=e.message;if(!UI.modal)render()}
}
async function cloudPush(now){
  if(!CLOUD_ON||!CLOUD.session)return;
  clearTimeout(CLOUD.timer);
  if(!now){CLOUD.timer=setTimeout(()=>cloudPush(true),1500);return}
  if(CLOUD.busy){CLOUD.timer=setTimeout(()=>cloudPush(true),1500);return}
  CLOUD.busy=true;CLOUD.status='sync';
  try{
    const rows=await rest('POST','?on_conflict=user_id',{user_id:CLOUD.session.uid,dados:DB,versao_app:'3.1'});

/* ===================== Motor de distribuição ===================== */
const isPlanner=p=>p.mode!=='escala';
function shiftOf(p,s){if(isPlanner(p))return null;const k=p.shifts[s];return k&&p.shiftTypes[k]?{k,...p.shiftTypes[k]}:null}
function dayCtx(p,s){
  const st=p.settings,d=parse(s),busy=[];
  const t=shiftOf(p,s),y=shiftOf(p,ds(addDays(d,-1)));
  busy.push([0,st.wake]);busy.push([st.sleep,1440]);
  let postNight=false;
  if(y&&y.e>1440){postNight=true;busy.push([0,Math.min(1440,y.e-1440+st.buffer+st.rest)])}
  if(t)busy.push([t.s-st.buffer,t.e+st.buffer]);
  const work=!!(st.work.on&&!t&&st.work.days.includes(d.getDay()));
  if(work)busy.push([st.work.s-st.buffer,st.work.e+st.buffer]);
  return{busy,shift:t,postNight,work,off:!t&&!postNight&&!work};
}
function freeWin(busy){
  const b=busy.map(x=>[Math.max(0,x[0]),Math.min(1440,x[1])]).filter(x=>x[1]>x[0]).sort((a,c)=>a[0]-c[0]);
  const out=[];let cur=0;
  for(const[s,e]of b){if(s>cur)out.push([cur,s]);cur=Math.max(cur,e)}
  if(cur<1440)out.push([cur,1440]);return out;
}
const freeMin=busy=>freeWin(busy).reduce((a,[s,e])=>a+e-s,0);
function findSlot(busy,dur,period){
  const[ps,pe]=PERIODS[period]||PERIODS.any;
  for(const[s,e]of freeWin(busy)){
    const a=Math.ceil(Math.max(s,ps)/15)*15;
    if(a<pe&&a+dur<=e&&a+dur<=pe+60)return a;
  }
  return null;
}
function itemsBusy(p,s,c){(p.plan[s]||[]).forEach(it=>c.busy.push([it.s-p.settings.gap,it.s+it.dur+p.settings.gap]))}

/* Distribui tarefas e atividades recorrentes da semana nas janelas livres.
   Dias passados ficam como histórico; compromissos fixos, itens concluídos e itens ajustados à mão são mantidos. */
const PRIO={alta:{n:'Alta',c:'#ef4444',w:30},media:{n:'Média',c:'#f59e0b',w:12},baixa:{n:'Baixa',c:'#94a3b8',w:4}};
const taskById=(p,id)=>p.tasks.find(t=>t.id===id);
function distribute(p,mon){
  const days=weekDays(mon),t0=todayS(),ctx={},fails=[];let placed=0;
  const avail=days.filter(s=>s>=t0);
  if(!avail.length)return{fails,placed,past:true};
  days.forEach(s=>{
    const list=p.plan[s]||[];
    p.plan[s]=s>=t0
      ?list.filter(it=>(it.fixed||it.done||it.manual)&&!(it.task&&!taskById(p,it.task)))
      :list.filter(it=>!(it.task&&!it.done));            /* tarefa não feita no passado volta para a fila */
    const c=dayCtx(p,s);itemsBusy(p,s,c);
    c.free0=Math.max(60,freeMin(c.busy));c.load=0;ctx[s]=c;
  });
  const put=(s,slot,base)=>{const it={id:uid(),s:slot,done:false,...base};p.plan[s].push(it);
    ctx[s].busy.push([slot-p.settings.gap,slot+it.dur+p.settings.gap]);ctx[s].load+=it.dur;placed++};
  /* 1) Tarefas avulsas: prioridade e prazo primeiro */
  const sched=new Set();Object.values(p.plan).forEach(l=>l.forEach(it=>{if(it.task)sched.add(it.task)}));
  const tasks=p.tasks.filter(t=>!t.done&&!sched.has(t.id))
    .sort((a,b)=>(PRIO[a.prio].w<PRIO[b.prio].w)-(PRIO[a.prio].w>PRIO[b.prio].w)||String(a.due||'9').localeCompare(String(b.due||'9')));
  for(const t of tasks){
    let best=null;
    avail.forEach((s,k)=>{
      if(t.due&&t.due>=avail[0]&&s>t.due)return;
      const slot=findSlot(ctx[s].busy,t.dur,t.period||'any');if(slot==null)return;
      const score=(ctx[s].load+t.dur)/ctx[s].free0*100+k*PRIO[t.prio].w;
      if(!best||score<best.score)best={s,slot,score};
    });
    if(best)put(best.s,best.slot,{task:t.id,t:t.t,cat:t.cat,dur:t.dur});
    else if(!t.due||t.due<=days[6])fails.push({name:'Tarefa “'+t.t+'”',left:1,due:t.due});
  }
  /* 2) Atividades recorrentes */
  const acts=p.acts.filter(a=>a.on!==false&&a.per>0)
    .sort((a,b)=>(b.onlyOff-a.onlyOff)||(b.dur-a.dur)||(b.per-a.per));
  for(const a of acts){
    const used=new Set();
    days.forEach((s,i)=>{if(p.plan[s].some(it=>it.act===a.id))used.add(i)});
    const have=days.reduce((n,s)=>n+p.plan[s].filter(it=>it.act===a.id).length,0);
    let need=Math.min(a.per-have,Math.ceil(a.per*avail.length/7));
    const ideal=7/a.per;
    while(need>0){
      let best=null;
      days.forEach((s,i)=>{
        if(s<t0)return;
        const c=ctx[s];
        if(a.onlyOff&&!c.off)return;
        if(used.has(i)&&a.per<=7)return;
        const slot=findSlot(c.busy,a.dur,a.period);if(slot==null)return;
        let score=(c.load+a.dur)/c.free0*100;
        used.forEach(j=>{const g=Math.abs(i-j);if(g<ideal)score+=(ideal-g)*25});
        if(!best||score<best.score)best={s,i,slot,score};
      });
      if(!best){fails.push({name:a.name,left:need,onlyOff:a.onlyOff});break}
      put(best.s,best.slot,{act:a.id,t:a.name,cat:a.cat,dur:a.dur});used.add(best.i);need--;
    }
  }
  days.forEach(s=>p.plan[s].sort((a,b)=>a.s-b.s));
  return{fails,placed};
}

const deacc=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'');
function parseNL(raw,base){
  base=base||new Date();
  const orig=(' '+String(raw||'').trim().normalize('NFC')+' ').replace(/\s/g,' ');
  let low=deacc(orig.toLowerCase());
  if(low.length!==orig.length)low=deacc(orig).toLowerCase();
  let date=null,time=null,value=null,m;
  const blank=(i,len)=>{low=low.slice(0,i)+' '.repeat(len)+low.slice(i+len)};
  const cut=re=>{const r=low.match(re);if(r)blank(r.index,r[0].length);return r};
  /* data */
  if(cut(/\bdepois de amanha\b/))date=addDays(base,2);
  else if(cut(/\bamanha\b/))date=addDays(base,1);
  else if(cut(/\bhoje\b/))date=new Date(base);
  else if(cut(/\bontem\b/))date=addDays(base,-1);
  if(!date&&(m=cut(/\b(?:(?:no|na|nesta|neste|proxim[oa])\s+)?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:[- ]feira)?\b/))){
    const w=WD[m[1]];let diff=(w-base.getDay()+7)%7;if(diff===0)diff=7;date=addDays(base,diff)}
  if(!date&&(m=cut(/\b(?:dia\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    let y=m[3]?+m[3]:base.getFullYear();if(y<100)y+=2000;date=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&date<addDays(base,-1))date.setFullYear(y+1)}
  if(!date&&(m=cut(/\bdia\s+(\d{1,2})(?:\s+de\s+([a-z]+))?\b/))){
    const mo=m[2]&&MESN[m[2]]?MESN[m[2]]-1:base.getMonth();date=new Date(base.getFullYear(),mo,+m[1]);
    if(date<addDays(base,-1))date=m[2]?new Date(base.getFullYear()+1,mo,+m[1]):new Date(base.getFullYear(),mo+1,+m[1])}
  /* hora */
  if((m=cut(/(?:\b(?:as|a partir das|depois das)\s+)?\b(\d{1,2})[:h](\d{2})\b/)))time=+m[1]*60+ +m[2];
  else if((m=cut(/(?:\bas\s+)?\b(\d{1,2})\s?(?:h|hs|horas?)\b(?:\s*e\s*(\d{1,2})(?:\s*min(?:utos)?)?)?/)))time=+m[1]*60+(m[2]?+m[2]:0);
  else if((m=cut(/\bas\s+(\d{1,2})\b/)))time=+m[1]*60;
  else if(cut(/\bmeio[- ]dia\b/))time=720;
  if(time!=null){if(cut(/\bda (noite|tarde)\b/)&&time<720)time+=720;else cut(/\bda manha\b/)}
  if(time!=null&&time>=1440)time=null;
  /* valor */
  const isExp=/\b(gastei|paguei|comprei|gasto|despesa|custou)\b/.test(low);
  if(isExp&&(m=cut(/(?:r\$\s*)?\b(\d+(?:[.,]\d{1,2})?)\b(?:\s*(?:reais|conto|pila))?/)))value=parseFloat(m[1].replace(',','.'));
  /* tipo */
  let kind;
  if(isExp&&value)kind='gasto';
  else if(/\b(me lembr[ae]|lembr[ae]te|me avis[ae]|lembrar)\b/.test(low))kind='lembrete';
  else if(time!=null&&/consulta|reuni|dentista|medic|exame|aula|encontro|entrevista|vacina|terapia|fisio/.test(low))kind='compromisso';
  else if(time!=null)kind='lembrete';
  else kind='tarefa';
  /* título = texto original menos o que foi interpretado e as palavras de comando */
  let r;const FILL=/\b(me lembr[ae]|lembr[ae]te|me avis[ae]|lembrar|preciso|tenho que|anota|anotar|gastei|paguei|comprei|gasto|despesa|custou|reais|r\$)\b/g;
  while((r=FILL.exec(low)))blank(r.index,r[0].length);
  let title=[...orig].map((c,i)=>low[i]===' '?' ':c).join('').replace(/\s+/g,' ').trim();
  for(let k=0;k<3;k++)title=title.replace(/^(de|do|da|que|no|na|em|pra|para|com|e)\s+/i,'').replace(/\s+(de|do|da|no|na|em|pra|para|e|às|as|a|com)$/i,'');
  if(!title)title=kind==='gasto'?'Gasto':'Sem título';
  title=title.charAt(0).toUpperCase()+title.slice(1);
  const L=deacc(title.toLowerCase());
  const cat=kind==='gasto'?((ECAT_KW.find(([,re])=>re.test(L))||['outros'])[0]):((PCAT_KW.find(([,re])=>re.test(L))||['pessoal'])[0]);
  if(!date&&(kind==='lembrete'||kind==='compromisso'||kind==='gasto'))date=new Date(base);
  if(kind==='lembrete'&&time==null)time=540;
  if(kind==='lembrete'&&ds(date)===ds(base)&&time<=base.getHours()*60+base.getMinutes())date=addDays(date,1);
  return{kind,title,date:date?ds(date):'',time,value,cat};
}

    (p.plan[s]||[]).forEach(it=>{const k=CATS[it.cat]||CATS.pessoal;
      b+=blk(it.s,it.s+it.dur,it.done?'dn':'',`<b>${hm(it.s)}</b> ${esc(it.t)}`,`background:${k.c}22;border-left:3px solid ${k.c};color:#1f2340`,`data-a="editItem" data-v="${s}|${it.id}"`)});

  h+=`<div class="card"><h3>Tempo por área</h3>`;
  const cats=Object.entries(w.byCat).sort((a,b)=>b[1].p-a[1].p);
  if(!cats.length)h+=`<div class="empty">Distribua a semana para ver o panorama.</div>`;
  const maxP=Math.max(1,...cats.map(c=>c[1].p));
  cats.forEach(([k,v])=>{const c=CATS[k]||CATS.pessoal;h+=`<div style="margin:10px 0"><div class="row"><span class="sp">${c.i} ${c.n}</span><span class="mut">${v.nd}/${v.n} · ${fdur(v.d)} de ${fdur(v.p)}</span></div>
    <div class="hb"><i style="width:${v.p/maxP*100}%;background:${c.c}33"></i><i style="width:${v.d/maxP*100}%;background:${c.c}"></i></div></div>`});
  h+=`</div>`;
  if(w.habits.length){h+=`<div class="card"><h3>Hábitos na semana</h3>`;
    w.habits.forEach(x=>{const r=x.due?x.done/x.due:0;h+=`<div style="margin:10px 0"><div class="row"><span class="sp">${esc(x.h.icon||'✅')} ${esc(x.h.name)}</span><span class="mut">${x.done}/${x.due} · 🔥 ${streak(p,x.h)}</span></div>
      <div class="hb"><i style="width:${r*100}%;background:var(--ok)"></i></div></div>`});h+=`</div>`}
  const wexp=p.expenses.filter(e=>e.date>=w.days[0].s&&e.date<=w.days[6].s),wt=wexp.reduce((a,e)=>a+e.v,0);
  if(wexp.length){const by={};wexp.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.v);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="card row"><div class="sp"><h3 style="margin:0">💰 Gastos da semana</h3><div class="mut">Maior: ${(ECATS[top[0]]||ECATS.outros).i} ${(ECATS[top[0]]||ECATS.outros).n} (${brl(top[1])})</div></div><b style="font-size:20px">${brl(wt)}</b></div>`}
  h+=`<div class="card"><h3>Humor da semana</h3><div class="row" style="justify-content:space-between">${w.days.map((d,i)=>`<div style="text-align:center"><div style="font-size:22px">${w.moods[i]?MOODS[w.moods[i]]:'·'}</div><div class="mut">${DOW[parse(d.s).getDay()]}</div></div>`).join('')}</div></div>`;
  h+=`<div class="card"><h3>Como o dia acordado se divide</h3>
    <div class="row mut wrap" style="gap:12px;margin-bottom:6px"><span style="color:#1e293b">■ ${p.mode==='escala'?'escala':'expediente'}</span><span style="color:var(--pri)">■ atividades</span><span style="color:#10b981">■ livre</span></div>`;
  w.days.forEach(d=>{const tot=Math.max(1,p.settings.sleep-p.settings.wake);
    const sh=Math.min(d.shiftMin+d.workMin,tot),pl=Math.min(d.planned,tot-sh),fr=Math.min(d.free,Math.max(0,tot-sh-pl));
    h+=`<div class="row" style="margin:6px 0"><span style="width:58px" class="mut">${DOW[parse(d.s).getDay()]} ${parse(d.s).getDate()}</span>
      <div class="stack sp"><i style="width:${sh/tot*100}%;background:#1e293b"></i><i style="width:${pl/tot*100}%;background:var(--pri)"></i><i style="width:${fr/tot*100}%;background:#10b981"></i></div></div>`});
  const heavy=w.days.slice().sort((a,b)=>(b.shiftMin+b.workMin+b.planned)-(a.shiftMin+a.workMin+a.planned))[0];
  const light=w.days.slice().sort((a,b)=>b.free-a.free)[0];
  const tips=[];
  if(w.n&&heavy)tips.push(`Dia mais pesado: <b>${dmy(heavy.s)}</b> (${fdur(heavy.shiftMin+heavy.workMin+heavy.planned)} ocupados).`);
  if(light)tips.push(`Maior respiro: <b>${dmy(light.s)}</b> com ${fdur(light.free)} livres.`);
  if(w.habitPct!=null&&w.habitPct<50)tips.push(`Hábitos abaixo de 50%: reduza a frequência ou escolha um só para focar.`);
  if(awake&&w.fixed/awake>.5)tips.push(`${p.mode==='escala'?'A escala':'O expediente'} ocupa ${Math.round(w.fixed/awake*100)}% do tempo acordado. Proteja os dias livres para descanso.`);
  h+=tips.length?`<div class="mut" style="margin-top:10px">${tips.join('<br>')}</div>`:'';
  return h+`</div>`;
},

}
function expModal(id){
  const e=P().expenses.find(x=>x.id===id);if(!e)return;
  openModal(`<h3>Gasto</h3><div class="grid2"><label class="field"><span>Valor (R$)</span><input id="e-v" type="number" step="0.01" value="${e.v}"></label>
    <label class="field"><span>Data</span><input id="e-d" type="date" value="${e.date}"></label></div>
    <label class="field"><span>Descrição</span><input id="e-t" value="${esc(e.desc)}"></label>
    <label class="field"><span>Categoria</span><select id="e-c">${Object.entries(ECATS).map(([k,x])=>`<option value="${k}" ${e.cat===k?'selected':''}>${x.i} ${x.n}</option>`).join('')}</select></label>
    <div class="row" style="margin-top:12px"><button class="btn danger" data-a="delExp" data-v="${e.id}">Excluir</button><span class="sp"></span>
    <button class="btn ghost" data-a="close">Cancelar</button><button class="btn" data-a="saveExp" data-v="${e.id}">Salvar</button></div>`);
}
/* ===================== Exportações ===================== */
function download(name,text,type){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function icsStamp(s,min){const d=addDays(parse(s),Math.floor(min/1440)),m=min%1440;return ds(d).replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00'}
function buildICS(p,mon){
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ritmo//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const ev=(s,a,b,t)=>L.push('BEGIN:VEVENT','UID:'+uid()+'@ritmo','DTSTAMP:'+now,'DTSTART:'+icsStamp(s,a),'DTEND:'+icsStamp(s,b),'SUMMARY:'+String(t).replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,' '),'END:VEVENT');
  weekDays(mon).forEach(s=>{const t=shiftOf(p,s);if(t)ev(s,t.s,t.e,'Plantão '+t.k);(p.plan[s]||[]).forEach(it=>ev(s,it.s,it.s+it.dur,it.t));p.reminders.filter(r=>r.date===s&&!r.done).forEach(r=>ev(s,r.time,r.time+15,'⏰ '+r.t))});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

/* ===================== Ações ===================== */
const split=v=>String(v).split('|');
function addTask(title){const t=String(title||'').trim();if(!t)return false;P().tasks.push({id:uid(),t,cat:'pessoal',prio:'media',dur:30,due:'',period:'any',done:false,created:todayS()});return true}
function addGoal(title){const t=String(title||'').trim();if(!t)return false;const k=UI.month.slice(0,7),p=P();(p.goals[k]=p.goals[k]||[]).push({id:uid(),t,done:false});return true}
const A={
  login:v=>loginModal(v||'entrar'),
  authGo:async v=>{
    const e=val('l-e').trim(),pw=document.getElementById('l-p')?val('l-p'):'',msg=document.getElementById('l-msg');
    if(!e||(v!=='senha'&&pw.length<6)){msg.textContent='Informe e-mail e senha (mínimo 6 caracteres).';return}
    msg.textContent='Aguarde…';
    try{
      if(v==='senha'){await authCall('recover',{email:e});msg.textContent='Se o e-mail tiver conta, chegou um link para trocar a senha.';return}
      if(v==='criar'){const j=await authCall('signup',{email:e,password:pw});
        if(!j.access_token){msg.textContent='Conta criada! Confirme pelo link no seu e-mail e depois toque em Entrar.';return}
        setSession(keepSession(j))}
      else setSession(keepSession(await authCall('token?grant_type=password',{email:e,password:pw})));
      closeModal();toast('☁️ Conectado como '+e);await cloudPull();render();
    }catch(err){msg.textContent=err.message}
  },
  logout:()=>{if(!confirm('Sair da conta? Os dados continuam neste aparelho.'))return;
    const t=CLOUD.session&&CLOUD.session.access_token;if(t)fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t}}).catch(()=>{});
    setSession(null);CLOUD.status='off';render()},
  syncNow:()=>{cloudPull().then(()=>{toast('☁️ Sincronizado');render()})},
  /* Captura, lembretes, gastos */
  capture:()=>captureModal(),
  capKind:v=>{capRead();UI.cap.kind=v;UI.capManual=v;if(v==='lembrete'&&UI.cap.time==null)UI.cap.time=540;if((v!=='tarefa')&&!UI.cap.date)UI.cap.date=todayS();capRefresh()},
  mic:()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Ditado indisponível neste navegador. Use o 🎤 do teclado do celular.');return}
    const r=new SR(),ta=document.getElementById('cap-t'),b=document.getElementById('mic');r.lang='pt-BR';r.interimResults=true;
    r.onresult=e=>{ta.value=[...e.results].map(x=>x[0].transcript).join(' ');ta.dispatchEvent(new Event('input',{bubbles:true}))};
    r.onend=()=>b&&b.classList.remove('rec');r.onerror=e=>toast('Microfone: '+(e.error==='not-allowed'?'permita o acesso ao microfone':e.error));
    try{r.start();b.classList.add('rec')}catch(e){toast('Não foi possível usar o microfone.')}},
  capSave:()=>{
    const p=P(),c=capRead(),t=(c.title||'').trim();if(!t){alert('Escreva o que anotar.');return}
    if(c.kind==='tarefa'){p.tasks.push({id:uid(),t,cat:c.cat,prio:'media',dur:30,due:c.date||'',period:'any',done:false,created:todayS()});toast('📝 Tarefa na fila: '+t)}
    else if(c.kind==='lembrete'){const d=c.date||todayS(),tm=c.time??540;p.reminders.push({id:uid(),t,date:d,time:tm,done:false,notified:false});toast(`⏰ Vou te lembrar ${d===todayS()?'hoje':dmy(d)} às ${hm(tm)}`)}
    else if(c.kind==='compromisso'){const d=c.date||todayS(),tm=c.time??540;(p.plan[d]=p.plan[d]||[]).push({id:uid(),t,cat:c.cat,s:tm,dur:60,fixed:true,done:false});p.plan[d].sort((a,b)=>a.s-b.s);
      if(tm>=30)p.reminders.push({id:uid(),t:'Daqui a 30 min: '+t,date:d,time:tm-30,done:false,notified:false});toast(`📅 ${t} · ${dmy(d)} ${hm(tm)}`)}
    else{if(!c.value){alert('Informe o valor.');return}p.expenses.push({id:uid(),v:c.value,desc:t,cat:c.cat,date:c.date||todayS()});toast('💰 '+brl(c.value)+' em '+(ECATS[c.cat]||ECATS.outros).n)}
    save();closeModal();
  },
  briefToggle:()=>{UI.brief=!UI.brief;render()},
  briefWa:()=>{window.open('https://wa.me/?text='+encodeURIComponent(briefing(P(),todayS())),'_blank')},
  notifOn:()=>{try{Notification.requestPermission().then(()=>render())}catch(e){}},
  goSub:v=>{UI.tab='planos';UI.sub=v;render();window.scrollTo(0,0)},
  remToggle:v=>{const r=P().reminders.find(x=>x.id===v);if(r){r.done=!r.done;r.notified=true;save();render()}},
  remDel:v=>{const p=P();p.reminders=p.reminders.filter(x=>x.id!==v);save();render()},
  remClear:()=>{const p=P();p.reminders=p.reminders.filter(x=>!x.done);save();render()},
  wview:v=>{UI.wview=v;render()},
  editExp:v=>expModal(v),
  saveExp:v=>{const e=P().expenses.find(x=>x.id===v),val2=parseFloat(val('e-v'));if(!e||!val2)return;
    Object.assign(e,{v:val2,date:val('e-d')||e.date,desc:val('e-t').trim()||e.desc,cat:val('e-c')});save();closeModal()},
  delExp:v=>{const p=P();p.expenses=p.expenses.filter(x=>x.id!==v);save();closeModal()},
  tab:v=>{UI.tab=v;UI.msg=null;render();window.scrollTo(0,0)},
  sub:v=>{UI.sub=v;render()},
  seen:()=>{DB.seen=true;save();render()},
  wk:v=>{UI.week=ds(addDays(parse(UI.week),7*+v));UI.msg=null;render()},
  mo:v=>{const d=parse(UI.month);UI.month=ds(new Date(d.getFullYear(),d.getMonth()+ +v,1));render()},
  distribute:()=>{
    const p=P(),r=distribute(p,parse(UI.week));save();
    if(r.past)UI.msg=`<div class="alert">Essa semana já passou. Os registros ficam como histórico.</div>`;
    else UI.msg=(r.fails.length?`<div class="alert"><b>Não coube tudo:</b><br>${r.fails.map(x=>`• ${esc(x.name)}${x.left>1?`: faltou ${x.left}x`:''}${x.onlyOff?' (só em dia livre, e há poucos nesta semana)':''}`).join('<br>')}<br>Reduza frequência/duração, mude o período ou estenda o prazo.</div>`:'')
      +`<div class="okmsg">${r.placed} blocos encaixados no seu tempo livre. Toque num item para ajustar horário ou dia.</div>`;
    render();
  },
  ics:()=>{download('ritmo-semana-'+UI.week+'.ics',buildICS(P(),parse(UI.week)),'text/calendar')},
  toggle:v=>{const p=P(),[s,id]=split(v),it=(p.plan[s]||[]).find(x=>x.id===id);if(!it)return;
    it.done=!it.done;if(it.task){const t=taskById(p,it.task);if(t)setTaskDone(p,t,it.done)}save();render()},
  editItem:v=>{const[s,id]=split(v);itemModal(s,id)},
  newItem:v=>itemModal(v||todayS(),null),
  saveItem:v=>{
    const p=P(),[s0,id]=split(v),t=val('f-t').trim(),d=val('f-d');
    if(!t||!d){alert('Preencha título e data.');return}
    const data={t,cat:val('f-c'),s:toMin(val('f-s')),dur:Math.max(5,+val('f-u')||60)};
    if(id){
      const list=p.plan[s0]||[],i=list.findIndex(x=>x.id===id);if(i<0)return closeModal();
      const it=Object.assign(list[i],data);it.manual=true;
      if(it.task){const tk=taskById(p,it.task);if(tk){tk.t=data.t;tk.cat=data.cat;tk.dur=data.dur}}
      if(d!==s0){list.splice(i,1);(p.plan[d]=p.plan[d]||[]).push(it)}
    }else(p.plan[d]=p.plan[d]||[]).push({id:uid(),...data,fixed:true,done:false});
    (p.plan[d]||[]).sort((a,b)=>a.s-b.s);save();closeModal();
  },
  delItem:v=>{const p=P(),[s,id]=split(v);p.plan[s]=(p.plan[s]||[]).filter(x=>x.id!==id);save();closeModal()},
  editAct:v=>actModal(v||null),
  saveAct:v=>{
    const p=P(),n=val('a-n').trim();if(!n){alert('Dê um nome à atividade.');return}
    const data={name:n,cat:val('a-c'),per:Math.min(7,Math.max(1,+val('a-p')||1)),dur:Math.max(5,+val('a-u')||30),period:val('a-r'),
      onlyOff:document.getElementById('a-o').checked,on:document.getElementById('a-on').checked};
    if(v){const a=p.acts.find(x=>x.id===v);Object.assign(a,data);Object.values(p.plan).forEach(l=>l.forEach(it=>{if(it.act===v){it.t=data.name;it.cat=data.cat}}))}
    else p.acts.push({id:uid(),...data});
    save();closeModal();
  },
  delAct:v=>{const p=P();if(!confirm('Excluir atividade? Itens já concluídos ficam no histórico.'))return;
    p.acts=p.acts.filter(x=>x.id!==v);Object.keys(p.plan).forEach(s=>p.plan[s]=p.plan[s].filter(it=>it.act!==v||it.done));save();closeModal()},
  /* Tarefas */
  quickTask:()=>{const el=document.getElementById('q-task');if(el&&addTask(el.value)){save();render()}},
  taskToggle:v=>{const p=P(),t=taskById(p,v);if(t){setTaskDone(p,t,!t.done);save();render()}},
  editTask:v=>taskModal(v),
  saveTask:v=>{const p=P(),t=taskById(p,v),n=val('t-t').trim();if(!t||!n)return;
    Object.assign(t,{t:n,cat:val('t-c'),prio:val('t-p'),due:val('t-d'),dur:Math.max(5,+val('t-u')||30),period:val('t-r')});
    Object.values(p.plan).forEach(l=>l.forEach(it=>{if(it.task===t.id){it.t=t.t;it.cat=t.cat}}));save();closeModal()},
  delTask:v=>{const p=P();p.tasks=p.tasks.filter(t=>t.id!==v);Object.keys(p.plan).forEach(s=>p.plan[s]=p.plan[s].filter(it=>it.task!==v));save();closeModal()},
  clearDone:()=>{const p=P();if(!confirm('Remover tarefas concluídas da lista? O histórico da agenda fica.'))return;
    const ids=new Set(p.tasks.filter(t=>t.done).map(t=>t.id));p.tasks=p.tasks.filter(t=>!t.done);
    Object.values(p.plan).forEach(l=>l.forEach(it=>{if(ids.has(it.task)){delete it.task}}));save();render()},
  /* Hábitos, prioridades, humor, metas */
  habit:v=>{const p=P(),s=todayS(),l=p.hlog[s]=p.hlog[s]||[];const i=l.indexOf(v);if(i<0)l.push(v);else l.splice(i,1);save();render()},
  editHabit:v=>habitModal(v||null),
  saveHabit:v=>{const p=P(),n=val('h-n').trim();if(!n){alert('Dê um nome ao hábito.');return}
    const days=[...document.querySelectorAll('.h-d:checked')].map(x=>+x.value);if(!days.length){alert('Escolha ao menos um dia.');return}
    const data={name:n,icon:val('h-i').trim()||'✅',days};
    if(v)Object.assign(p.habits.find(h=>h.id===v),data);else p.habits.push({id:uid(),...data});save();closeModal()},
  delHabit:v=>{const p=P();p.habits=p.habits.filter(h=>h.id!==v);save();closeModal()},
  topToggle:v=>{const p=P(),s=todayS(),t=p.top[s]=p.top[s]||[{t:'',done:false},{t:'',done:false},{t:'',done:false}];t[+v].done=!t[+v].done;save();render()},
  mood:v=>{const p=P(),s=todayS(),n=p.notes[s]=p.notes[s]||{};n.mood=n.mood===+v?0:+v;save();render()},
  quickGoal:()=>{const el=document.getElementById('q-goal');if(el&&addGoal(el.value)){save();render()}},
  goalToggle:v=>{const g=(P().goals[UI.month.slice(0,7)]||[]).find(x=>x.id===v);if(g){g.done=!g.done;save();render()}},
  goalDel:v=>{const p=P(),k=UI.month.slice(0,7);p.goals[k]=(p.goals[k]||[]).filter(x=>x.id!==v);save();render()},
  /* Escala e perfis */
  paint:v=>{UI.paint=v;render()},
  day:v=>{const p=P();
    if(p.mode!=='escala'){UI.week=ds(mondayOf(parse(v)));UI.tab='semana';UI.msg=null;render();window.scrollTo(0,0);return}
    if(UI.paint==='-'||p.shifts[v]===UI.paint)delete p.shifts[v];else p.shifts[v]=UI.paint;save();render()},
  pattern:()=>patternModal(),
  applyPattern:()=>{
    const p=P(),k=val('p-k'),start=val('p-d'),n=+val('p-n');
    const seq=k==='custom'?val('p-c').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean):PATTERNS[k].seq;
    if(!seq.length||!start){alert('Defina o padrão e a data.');return}
    const bad=seq.filter(c=>c!=='-'&&!p.shiftTypes[c]);if(bad.length){alert('Código desconhecido: '+bad.join(', '));return}
    for(let i=0;i<n;i++){const s=ds(addDays(parse(start),i)),c=seq[i%seq.length];if(c==='-')delete p.shifts[s];else p.shifts[s]=c}
    save();closeModal();
  },
  mode:v=>{const p=P();if(p.mode===v)return;p.mode=v;
    if(v==='fixo')p.settings.work.on=true;if(v==='livre')p.settings.work.on=false;save();render()},
  addProfile:()=>profileModal(null),
  editProfile:v=>profileModal(+v),
  saveProfile:v=>{const n=val('r-n').trim();if(!n)return;
    if(v===''){DB.profiles.push(newProfile(n,val('r-m')));DB.cur=DB.profiles.length-1}else DB.profiles[+v].name=n;save();closeModal()},
  useProfile:v=>{DB.cur=+v;save();closeModal()},
  delProfile:v=>{if(!confirm('Excluir este perfil e todos os dados dele?'))return;DB.profiles.splice(+v,1);DB.cur=0;save();closeModal()},
  export:()=>download('ritmo-backup-'+todayS()+'.json',JSON.stringify(DB,null,1),'application/json'),
  close:()=>closeModal()
};
const C={
  profile:v=>{DB.cur=+v},
  pname:v=>{if(v.trim())P().name=v.trim()},
  'set.wake':v=>{P().settings.wake=toMin(v)},'set.sleep':v=>{P().settings.sleep=toMin(v)||1440},
  'set.rest':v=>{P().settings.rest=+v},'set.buffer':v=>{P().settings.buffer=+v},'set.gap':v=>{P().settings.gap=+v},
  'work.on':(v,el)=>{P().settings.work.on=el.checked},
  'work.day':(v,el)=>{const w=P().settings.work,d=+el.dataset.v;w.days=el.checked?[...new Set([...w.days,d])]:w.days.filter(x=>x!==d)},
  'work.s':v=>{P().settings.work.s=toMin(v)},'work.e':v=>{P().settings.work.e=toMin(v)},
  'shift.s':(v,el)=>{const t=P().shiftTypes[el.dataset.v],dur=t.e-t.s;t.s=toMin(v);t.e=t.s+dur},
  'shift.e':(v,el)=>{const t=P().shiftTypes[el.dataset.v];let e=toMin(v);if(e<=t.s)e+=1440;t.e=e},
  top:(v,el)=>{const p=P(),s=todayS(),t=p.top[s]=p.top[s]||[{t:'',done:false},{t:'',done:false},{t:'',done:false}];t[+el.dataset.v].t=v},
  note:v=>{const p=P(),s=todayS();(p.notes[s]=p.notes[s]||{}).text=v},
  quickTask:v=>{addTask(v)},
  quickGoal:v=>{addGoal(v)},
  import:(v,el)=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.profiles)throw 0;d.profiles.forEach(fixProfile);DB=d;DB.cur=0;save();render();alert('Backup restaurado.')}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
};
app.addEventListener('click',e=>{
  if(e.target.classList.contains('mask')){closeModal();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el)}
});
app.addEventListener('change',e=>{
  const el=e.target.closest('[data-c]');if(!el)return;
  const f=C[el.dataset.c];if(f){f(el.value,el);save();if(el.dataset.c!=='import')render()}
});
app.addEventListener('input',e=>{
  if(e.target.id==='cap-t'){const r=parseNL(e.target.value);if(UI.capManual){r.kind=UI.capManual;if(r.kind==='lembrete'&&r.time==null)r.time=540;if(r.kind!=='tarefa'&&!r.date)r.date=todayS()}UI.cap=r;capRefresh()}
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cap-t'){e.preventDefault();A.capSave();return}
  if(e.key==='Enter'&&e.target.matches('input.inl')){e.preventDefault();e.target.blur()}
});

/* ===================== Render ===================== */
function render(){
  const tabs=[['hoje','☀️','Hoje'],['semana','🗓️','Semana'],['mes','📆','Mês'],['planos','🎯','Planos'],['painel','📊','Painel'],['ajustes','⚙️','Ajustes']];
  app.innerHTML=`<header><div class="logo">Rit<b>mo</b></div>
    <select data-c="profile" aria-label="Perfil">${DB.profiles.map((x,i)=>`<option value="${i}" ${i===DB.cur?'selected':''}>${MODES[x.mode].i} ${esc(x.name)}</option>`).join('')}</select></header>
    <main>${VIEWS[UI.tab]()}</main>
    <nav><div class="in">${tabs.map(([k,i,n])=>`<button class="${UI.tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${n}</button>`).join('')}</div></nav>
    ${UI.modal?`<div class="mask"><div class="sheet">${UI.modal}</div></div>`:'<button class="fab" data-a="capture" aria-label="Anotar">＋</button>'}`;
}
render();
checkReminders();setInterval(checkReminders,20000);
if(CLOUD_ON&&CLOUD.session)cloudPull();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(CLOUD.session&&CLOUD.timer)cloudPush(true)}else{checkReminders();if(CLOUD_ON&&CLOUD.session&&!CLOUD.busy)cloudPull();else if(!UI.modal)render()}});
</script>
